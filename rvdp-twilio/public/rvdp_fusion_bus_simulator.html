</style></head><body>
<div id="stage" class="pn"><div class="mu"><span id="st_n"></span> <span class="tag">Simulated sensor data</span></div><h3 id="st_t"></h3><span id="st_chip" class="chip"></span><p id="st_d"></p><div id="rows"></div><div id="prog"></div><p id="sensor" class="mu">Tap any label to see what that component does.</p><pre id="sms"></pre><div id="rule" class="mu"></div><div id="act" class="mu" style="margin-top:4px"></div><div id="score"></div></div><div id="amb" class="pn" hidden></div><div id="rev" class="pn" hidden></div>
<div id="readings" class="pn"><h4 style="margin:0 0 6px"><span id="rd_toggle" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center"><span>Sensor readings <span class="tag">Simulated</span></span><span id="rd_arr" style="color:#3fd0e6;font-size:10px">▼ Hide</span></span></h4><div id="rd_wrap"><div id="rd"></div><h4>Event log</h4><div id="lg" style="font-size:11px"></div></div></div>
<div id="ctrl" class="pn"><div class="tabs"><button data-p="pane_c" class="on">Controls</button><button data-p="pane_t">Tests</button><button data-p="pane_r">Rules</button><button data-p="pane_f">Fleet</button></div><div id="pane_c"></div><div id="pane_t" hidden></div><div id="pane_r" hidden></div><div id="pane_f" hidden></div></div>
<div id="lblbar" class="pn"></div>
<div id="bar" class="pn"><div id="sc"></div><div id="ctl"></div><div id="tl"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

let okGL=typeof THREE!=='undefined';
if(okGL){try{const c=document.createElement('canvas');okGL=!!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){okGL=false}}
if(!okGL){document.body.insertAdjacentHTML('afterbegin','<div class="pn" style="left:50%;top:40%;transform:translateX(-50%);max-width:90vw"><b>3D view unavailable</b><div class="mu">WebGL is not available or three.js could not load from cdnjs. Please use a browser with WebGL enabled.</div></div>');throw new Error('No WebGL')}
//LOGIC-START
const DEF={drv:'alert',road:'smooth',temp:90,batt:12.6,tyre:32,speed:50,spo2:98,hr:78,pax:'normal',crowd:46,panic:false,med:false,camFault:false,gpsFault:false,gsmFault:false,brake:false,door:false,phone:false,belt:true,hours:1,mirrorFreq:2,indicator:false};
const TH0={persist:5,tempLim:105,tyreLow:26,spo2Lim:92,blink:.4,limit:80,hoursLim:4};
const LVN=['SAFE','WARNING','HIGH RISK','CRITICAL'];
const RULES={
R1:'Overall state is the worst of the four module states.',
R2:'Two or more modules abnormal at the same time: at least HIGH RISK.',
R3:'Driver at HIGH RISK or worse together with any vehicle fault: CRITICAL.',
R4:'A panic button (driver, conductor or passenger) overrides everything: CRITICAL at once.',
R5:'A condition that lasts longer than the persistence threshold is escalated.',
R6:'A failed camera, GPS or GSM is reported, never silently ignored.',
R7:'CRITICAL turns on hazard lights and sends one emergency SMS with GPS to the depot control room and 112 / ERSS.',
R8:'No GSM: log locally and show a failure. No GPS: send the SMS without location and say so.',
R9:'Medical button: CRITICAL, one ambulance alert (type, bus ID, route, time, GPS) to 108/112 and the depot; driver told to stop safely or head to the nearest hospital.'};
function paxCount(s,T){return (s.spo2<T.spo2Lim?1:0)+((s.hr<50||s.hr>130)?1:0)+(s.pax==='collapsed'?1:0)}
function sendPlan(s){return s.gsmFault?'logged-local':(s.gpsFault?'sent-no-location':'sent')}
function medPlan(s,c){
 if(!s.med)return{plan:'none',sms:false,say:''};
 if(c&&c.cancelled)return{plan:'cancelled',sms:false,say:'Cancelled by conductor within 10 s, logged'};
 if(s.gsmFault)return{plan:'logged-local',sms:false,say:'GSM fault: logged locally. Call 108 manually.'};
 return{plan:s.gpsFault?'sent-no-location':'sent',sms:true,say:'Ambulance alert sent to 108/112 and depot'+(s.gpsFault?' without location':'')}}
function evaluate(s,c,T){
 c=c||{};const R=new Set(),mod={},dd=c.dDur||0;
 let l=0,t='Alert',g='';
 if(s.camFault){l=1;t='Driver camera fault';g='DRIVER CAMERA FAULT';R.add('R6')}
 else if(s.drv==='closed'){
  if(dd<T.blink){t='Normal blink'}
  else if(dd<T.persist/2){l=1;t='Eyes closing';g='DRIVER DROWSINESS'}
  else if(dd<T.persist){l=2;t='Prolonged eye closure';g='DRIVER DROWSINESS'}
  else{l=3;t='Drowsy, no response';g='DRIVER DROWSINESS';R.add('R5')}
 }else if(s.drv==='yawn'||s.drv==='away'){
  const y=s.drv==='yawn';l=dd>=T.persist?2:1;t=y?'Yawning':'Distracted, head turned away';g=y?'DRIVER DROWSINESS':'DRIVER DISTRACTED';if(l===2)R.add('R5')}
 if(!s.camFault&&s.phone&&s.speed>5){const pl=s.speed>40?2:1;if(pl>l){l=pl;t='Phone use while moving';g='DRIVER PHONE USE'}}
 if(s.hours>T.hoursLim){if(!l){t='Long continuous driving';g='DRIVER FATIGUE RISK'}l=Math.min(3,l+1)}
 mod.driver={l,t,g};
 let p=0;const vt=[];let vg='';
 const vp=(n,m,k)=>{p+=n;vt.push(m);vg=vg||k};
 if(s.temp>T.tempLim+15)vp(2,'Engine overheating','ENGINE TEMPERATURE HIGH');else if(s.temp>T.tempLim)vp(1,'Engine temperature high','ENGINE TEMPERATURE HIGH');
 if(s.batt<10.5)vp(2,'Battery very low','BATTERY VOLTAGE LOW');else if(s.batt<11.8)vp(1,'Battery low','BATTERY VOLTAGE LOW');
 if(s.tyre<T.tyreLow-8)vp(2,'Tyre pressure very low','TYRE PRESSURE WARNING');else if(s.tyre<T.tyreLow)vp(1,'Tyre pressure low','TYRE PRESSURE WARNING');
 if(s.tyre<T.tyreLow&&s.speed>80)vp(1,'low tyre at high speed','TYRE PRESSURE WARNING');
 if(s.brake)vp(2,'Brake air pressure low','BRAKE AIR PRESSURE LOW');
 if(s.door&&s.speed>5)vp(2,'Door open while moving','DOOR OPEN WHILE MOVING');
 mod.vehicle={l:Math.min(3,p),t:p?vt.join(', '):'Healthy',g:vg};
 const rough=s.road==='rough';let rl=0,rt='Smooth',rg='';
 if(rough||c.spike){rl=1;rt=rough?'Rough road vibration':'Pothole impact (above 2 g)';rg='ROUGH ROAD / POTHOLE';if(s.speed>80){rl=2;rt+=' at high speed'}}
 if(!rl&&(c.harsh||s.speed>T.limit)){rl=1;rt=c.harsh?'Harsh braking':'Overspeed';rg=rt.toUpperCase()}
 mod.road={l:rl,t:rt,g:rg};
 let pl=0,pt='Normal',pg='';const medOn=s.med&&!c.cancelled;
 if(s.panic){pl=3;pt='Panic button pressed';pg='PASSENGER SAFETY EMERGENCY';R.add('R4')}
 if(medOn){pl=3;pt='Passenger medical emergency';pg='PASSENGER MEDICAL EMERGENCY';R.add('R9')}
 if(!s.panic&&!medOn){
  const n=paxCount(s,T);
  if(n>0){pl=Math.min(3,n);if((c.pDur||0)>=T.persist&&pl<3){pl++;R.add('R5')}
   if(pl>=2){pt='Possible Medical Emergency';pg='PASSENGER MEDICAL EMERGENCY'}else{pt='Vitals abnormal';pg='CHECK PASSENGER VITALS'}}}
 mod.passenger={l:pl,t:pt,g:pg};
 const ord=['driver','passenger','vehicle','road'],ls=ord.map(k=>mod[k].l);
 let o=Math.max(...ls);
 if(o>0)R.add('R1');
 if(ls.filter(x=>x>=1).length>=2&&o<2){o=2;R.add('R2')}
 if(mod.driver.l>=2&&mod.vehicle.l>=1&&o<3){o=3;R.add('R3')}
 if(s.gpsFault||s.gsmFault)R.add('R6');
 if(o===3)R.add('R7');
 if(o===3&&(s.gpsFault||s.gsmFault))R.add('R8');
 const w=(.35*mod.driver.l+.25*mod.vehicle.l+.15*mod.road.l+.25*mod.passenger.l)/3*100;
 const score=Math.min(100,Math.max([5,35,65,90][o],Math.round(w)));
 let top=null;for(const k of ord){if(mod[k].l>0&&(top===null||mod[k].l>mod[top].l))top=k}
 const msg=top?(mod[top].g||mod[top].t).toUpperCase():'ALL SYSTEMS NORMAL';
 const med=medPlan(s,c);
 return{mod,o,score,msg,cls:LVN[o]+(top?': '+mod[top].t:''),top,rules:[...R],med,plan:s.med?med.plan:sendPlan(s)};
}
/* driving behaviour score: separate from the live safety level */
const DED={lane_nomirror:['Lane change / turn without mirror check',5,'mirror'],nomirror30:['No mirror glance for 30 s while moving',2,'mirror'],harsh_brake:['Harsh braking',3,'brake'],harsh_acc:['Harsh acceleration',2,'acc'],corner:['Sharp cornering',3,'corner'],overspeed:['Overspeed for more than 10 s',4,'speed'],phone:['Phone use while moving',8,'phone'],belt:['Seatbelt not worn',3,'belt'],drowsy1:['Drowsiness WARNING',2,'drowsy'],drowsy2:['Drowsiness HIGH RISK',5,'drowsy'],drowsy3:['Drowsiness CRITICAL',10,'drowsy'],hours:['Hour beyond continuous driving limit',5,'hours'],lane_mirror:['Lane change with mirror check (good)',0,'good']};
const CAP={mirror:15,brake:9,acc:6,corner:9,speed:12,phone:16,belt:9,drowsy:20,hours:15};
const bandOf=x=>x>=85?'Good':x>=70?'Needs coaching':'Review required';
function scoreTrip(ev){
 const used={},ded=[];let pos=0;
 for(const e of ev){const d=DED[e.type];if(!d)continue;
  if(!d[1]){pos++;continue}
  const u=used[d[2]]||0,p=Math.min(d[1],CAP[d[2]]-u);
  if(p>0){used[d[2]]=u+p;ded.push(Object.assign({},e,{pts:p,label:d[0]}))}}
 const score=Math.max(0,100-ded.reduce((a,e)=>a+e.pts,0));
 return{score,ded,pos,band:bandOf(score)}}
const laneType=gap=>gap<=5?'lane_mirror':'lane_nomirror';
const mirrorGapType=(gap,speed)=>(gap>30&&speed>20)?'nomirror30':null;
const reviewFlag=a=>a.length>0&&(a[a.length-1]<70||(a.length>=3&&a.slice(-3).every(x=>x<80)));
const E=(p,c)=>evaluate(Object.assign({},DEF,p),Object.assign({dDur:0,pDur:0,spike:false,harsh:false},c),TH0);
const T1=(n,p,c,f)=>[n,()=>{const r=E(p,c);return[f(r),LVN[r.o]+' | '+r.cls]}];
const T2=(n,f)=>[n,()=>{const v=f();return[v[0],v[1]]}];
const sc1=e=>scoreTrip(e).score;
const TESTS=[
T1('Normal driving stays SAFE',{},{},r=>r.o===0),
T1('A 0.2 s blink gives no alarm',{drv:'closed'},{dDur:.2},r=>r.mod.driver.l===0),
T1('Eyes closed 3 s gives HIGH RISK',{drv:'closed'},{dDur:3},r=>r.o===2),
T1('Eyes closed 6 s gives CRITICAL',{drv:'closed'},{dDur:6},r=>r.o===3),
T1('Yawn + hot engine gives HIGH RISK by R2',{drv:'yawn',temp:112},{dDur:1},r=>r.o===2&&r.rules.includes('R2')),
T1('Drowsy (HIGH) + engine fault gives CRITICAL by R3',{drv:'closed',temp:112},{dDur:3},r=>r.o===3&&r.rules.includes('R3')),
T1('Panic alone gives CRITICAL by R4',{panic:true},{},r=>r.o===3&&r.rules.includes('R4')),
T1('SpO2 85 % alone gives WARNING',{spo2:85},{},r=>r.o===1&&r.mod.passenger.l===1),
T1('SpO2 85 % + collapse gives Possible Medical Emergency',{spo2:85,pax:'collapsed'},{},r=>/Possible Medical/.test(r.mod.passenger.t)),
T1('Camera fault is reported',{camFault:true},{},r=>r.mod.driver.t==='Driver camera fault'&&r.rules.includes('R6')),
T1('CRITICAL + GSM fault: logged locally',{panic:true,gsmFault:true},{},r=>r.plan==='logged-local'),
T1('CRITICAL + GPS fault: SMS sent without location',{panic:true,gpsFault:true},{},r=>r.plan==='sent-no-location'),
T1('CRITICAL + working GPS and GSM: normal SMS',{panic:true},{},r=>r.plan==='sent'),
T1('Medical button: CRITICAL + ambulance alert (R9)',{med:true},{},r=>r.o===3&&r.rules.includes('R9')&&r.med.plan==='sent'),
T1('Medical button + GSM fault: logged locally, call 108',{med:true,gsmFault:true},{},r=>r.med.plan==='logged-local'&&/108/.test(r.med.say)),
T1('Medical press cancelled within 10 s: nothing sent, logged',{med:true},{cancelled:true},r=>r.o===0&&!r.med.sms&&r.med.plan==='cancelled'),
T2('Lane change with mirror check: no deduction',()=>{const s=sc1([{type:laneType(2)}]);return[s===100,'score '+s]}),
T2('Lane change without mirror check deducts 5',()=>{const s=sc1([{type:laneType(9)}]);return[s===95,'score '+s]}),
T2('30 s without mirror glance deducts 2',()=>{const s=sc1([{type:mirrorGapType(31,40)}]);return[s===98,'score '+s]}),
T2('Phone use deducts 8',()=>{const s=sc1([{type:'phone'}]);return[s===92,'score '+s]}),
T2('Category caps hold (10 phone events = -16)',()=>{const s=sc1(Array(10).fill({type:'phone'}));return[s===84,'score '+s]}),
T2('Score never goes below 0',()=>{const s=sc1(Object.keys(DED).flatMap(k=>Array(6).fill({type:k})));return[s===0,'score '+s]}),
T2('Bands: 84 Needs coaching, 69 Review required',()=>[bandOf(84)==='Needs coaching'&&bandOf(69)==='Review required'&&bandOf(85)==='Good',bandOf(84)+' / '+bandOf(69)]),
T2('Three trips below 80 set Review required',()=>[reviewFlag([78,76,79])&&!reviewFlag([78,90,79])&&reviewFlag([90,66]),'flag logic']),
T2('Driving score never changes the live safety level',()=>{const a=E({}).o;sc1(Array(20).fill({type:'phone'}));return[a===E({}).o&&a===0,'live level '+LVN[a]]})
];
function runTests(){return TESTS.map(([n,f])=>{let ok=false,got='';try{const v=f();ok=!!v[0];got=v[1]}catch(e){got=String(e)}return{n,ok,got}})}
//LOGIC-END

/* ================= SCENE ================= */
const $=id=>document.getElementById(id),V3=THREE.Vector3,PI=Math.PI;
const HX=['#2fbf8f','#ffd166','#ff9800','#ff3030'];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1a24);scene.fog=new THREE.Fog(0x0b1a24,70,190);
const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,400);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xcfeeff,0x0b1a24,1.15));
const dlight=new THREE.DirectionalLight(0xffffff,.6);dlight.position.set(12,28,14);scene.add(dlight);
scene.add(new THREE.GridHelper(300,100,0x1b6a7a,0x123747));

const mc={};
function M(c,o){const k=c+'|'+(o||1);return mc[k]||(mc[k]=new THREE.MeshStandardMaterial({color:c,roughness:.65,metalness:.15,transparent:(o||1)<1,opacity:o||1,side:THREE.DoubleSide,depthWrite:(o||1)>=1}))}
function bx(p,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}
function cy(p,r,h,m,x,y,z,rz){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),m);o.position.set(x,y,z);if(rz)o.rotation.z=rz;p.add(o);return o}
function sp(p,r,m,x,y,z){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);p.add(o);return o}
function limb(p,a,b,r,m){const A=new V3(...a),B=new V3(...b),d=B.clone().sub(A),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10),m);o.scale.y=d.length();o.position.copy(A).add(B).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());p.add(o);return o}
function edge(o){o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),new THREE.LineBasicMaterial({color:0x5fd8ee,transparent:true,opacity:.6})));return o}

let locUI=null,twUI=null;
function updLoc(){if(!locUI)return;
 locUI.btn.textContent=LOC.id!==null?'Stop using laptop location':'Use my laptop location';locUI.btn.classList.toggle('on',LOC.id!==null);
 locUI.info.textContent=LOC.lat!=null?'Live fix: '+LOC.lat.toFixed(5)+', '+LOC.lng.toFixed(5)+' (accuracy about '+Math.round(LOC.acc)+' m)'+(LOC.acc>500?'. Low accuracy: laptop is probably using Wi-Fi/IP location.':''):(LOC.err||'Off: the SMS uses the demo GPS position.')}
function locStart(){
 if(!navigator.geolocation){LOC.err='This browser has no geolocation.';return updLoc()}
 LOC.err='Waiting for permission...';
 LOC.id=navigator.geolocation.watchPosition(p=>{LOC.lat=p.coords.latitude;LOC.lng=p.coords.longitude;LOC.acc=p.coords.accuracy;LOC.err='';updLoc();if(!LOC.logged){LOC.logged=1;log('Live location locked from laptop (+/-'+Math.round(LOC.acc)+' m)')}},
  e=>{LOC.err=e.code===1?'Permission denied. Click the lock icon in the address bar and allow Location.':e.code===2?'Position unavailable. Turn on Windows/macOS Location Services.':'Location timed out, retrying...';if(e.code===1){locStop(true)}updLoc()},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});updLoc()}

function setTw(t){TW.status=t;if(twUI)twUI.st.textContent=t}
async function twSend(body,force){
 if(!TW.enabled&&!force)return;
 if(!/^\+[1-9]\d{7,14}$/.test(TW.to)){setTw('Enter the phone number with country code, e.g. +919876543210');return}
 setTw('Sending through Twilio...');
 try{
  const r=await fetch(TW.url.replace(/\/$/,'')+'/api/send-alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:TW.to,body,lat:LOC.lat,lng:LOC.lng,acc:LOC.acc})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){setTw('Twilio: SMS '+j.status+' (SID '+j.sid+')');log('Twilio SMS sent to ...'+TW.to.slice(-4))}
  else{setTw('Twilio error: '+(j.error||('HTTP '+r.status)));log('Twilio SMS FAILED: '+(j.error||r.status))}
 }catch(e){setTw('Cannot reach the backend at '+TW.url+'. Is "node server.js" running?');log('Twilio backend not reachable')}}
let callPoller=null;
function startCallStatusPolling(){
 if(callPoller)return;
 callPoller=setInterval(async()=>{
  try{
   const r=await fetch(TW.url.replace(/\/$/,'')+'/api/call-status');
   const j=await r.json().catch(()=>({}));
   if(!j.ok)return;
   const stEl=document.getElementById('am_call_st');
   if(j.attended){
    if(stEl)stEl.textContent='✅ CALL ATTENDED! Receiver answered the phone. Calling stopped.';
    setTw('Call ATTENDED by receiver! Calling stopped.');
    clearInterval(callPoller);callPoller=null;
    return;
   }
   if(!j.active){
    if(stEl&&stEl.textContent.includes('Calling'))stEl.textContent='Call alerts inactive';
    clearInterval(callPoller);callPoller=null;
    return;
   }
   if(j.status==='calling'){
    const txt='📞 Calling '+TW.to+' (Attempt #'+(j.retryCount+1)+')... Answer to attend';
    if(stEl)stEl.textContent=txt;setTw(txt);
   }else if(j.status==='waiting-retry'){
    const txt='⚠️ Call not attended. Next retry in '+j.nextRetryInSec+' s (1 call/min)...';
    if(stEl)stEl.textContent=txt;setTw(txt);
   }
  }catch(e){}
 },2000);
}

}
async function twCall(message,reason){

 if(!/^\+[1-9]\d{7,14}$/.test(TW.to)){setTw('Enter the phone number with country code, e.g. +919876543210');return}

 const voiceLabel = TW.lang==='en-US' ? 'US English' : 'Indian Voice (Tanglish/English)';
 setTw('Initiating Twilio call ('+voiceLabel+') to '+TW.to+'...');
 log('Initiating Twilio call ('+voiceLabel+') to '+TW.to.slice(0,4)+'****'+TW.to.slice(-3)+'...');
 const stEl=document.getElementById('am_call_st');if(stEl)stEl.textContent='📞 Calling '+TW.to+'... Answer to attend';
 try{
  const r=await fetch(TW.url.replace(/\/$/,'')+'/api/make-call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:TW.to,message:sayMessage,language:TW.lang,reason,bus:busId(),route:FL[busIdx][1]})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){
   log('Twilio call active in '+TW.lang+' (status: '+j.status+')');
   startCallStatusPolling();

   setTw('Twilio Call: '+(j.error||('HTTP '+r.status)));

   if(stEl)stEl.textContent=(j.attended?'✅ Call already attended.':('⚠️ '+(j.error||r.status)));
  }
 }catch(e){setTw('Cannot reach backend for Call at '+TW.url);log('Twilio Call backend unreachable');if(stEl)stEl.textContent='⚠️ Backend not reachable'}}
function doSms(why){

 if(plan==='logged-local'){if(pk&&pk.m)scene.remove(pk.m);pk=null;$('sms').textContent='GSM FAULT: message NOT sent. Saved in local log. Dashboard: COMMUNICATION FAILURE'+(med?'\nDRIVER: call 108 manually.':'')+'\n'+body;log('Communication failure, event logged locally: '+why);return}

function laneChange(){indT=3;if(S.mirrorFreq===2&&S.drv==='alert'&&!S.camFault){lastMirror=clock-1;mirKick=1.2}

function tripStep(dt){
 indT=Math.max(0,indT-dt);S.indicator=indT>0;hbT=Math.max(0,hbT-dt);mirKick=Math.max(0,mirKick-dt);
 const per=S.mirrorFreq===2?7:22,mv=S.speed>20&&S.drv==='alert'&&!S.camFault&&S.mirrorFreq>0;
 mirrorNow=(mv&&(clock%per)<1.2)||mirKick>0;
 mirYaw=mirKick>0?.9:(mirrorNow?[.9,-.7,.35][Math.floor(clock/per)%3]:0);
 if(mirrorNow)lastMirror=clock;

 if(S.speed>T.limit){ovT+=dt;if(ovT>10&&!fl.ov){fl.ov=1;addEv('overspeed')}}else{ovT=0;fl.ov=0}
 if(S.phone&&S.speed>5){if(!fl.ph){fl.ph=1;addEv('phone')}}else fl.ph=0;
 if(!S.belt&&S.speed>5){if(!fl.bt){fl.bt=1;addEv('belt')}}else fl.bt=0;

}

/* ================= LOOP ================= */
const sm={eye:1,mouth:.05,pitch:0,yaw:0,hot:0,tyre:0,pz:0,ph:0,pan:0};
const lerp=(a,b,dt,s)=>a+(b-a)*Math.min(1,dt*s);
let last=performance.now(),t=0,beepT=0;const tmp=new V3(),tmp2=new V3();
let callTriggered=false;
function loop(){
 requestAnimationFrame(loop);
 const now=performance.now(),rdt=Math.min(.05,(now-last)/1000);last=now;const dt=rdt*mult;t+=rdt;clock+=dt;
 if(playing)stepRunner(dt);
 /* timers and decision */
 ctx.dDur=(S.drv!=='alert'&&!S.camFault)?ctx.dDur+dt:0;
 ctx.pDur=(paxCount(S,T)>0&&!S.panic)?ctx.pDur+dt:0;
 spkT=Math.max(0,spkT-dt);ctx.spike=spkT>0;spkVal=Math.max(0,spkVal-dt*.9);
 tripStep(dt);ctx.harsh=hbT>0;res=evaluate(S,ctx,T);tripAfter();
 if(res.o!==lastO){log(LVN[res.o]+(res.o?' - '+res.cls.split(': ')[1]:' - back to normal'));lastO=res.o}
 if(res.o===3&&!smsSent&&!(S.med&&clock-medStart<10)){
  smsSent=true;
  doSms(res.msg);
  if(TW.callOnConfirm&&!S.gsmFault&&!callTriggered){
   callTriggered=true;
   const callMsg=S.med
    ?(TW.msgTanglish||('Avasaram! RVDP bus emergency alert on bus '+busId()+'. Immediate ambulance required.'))
    :('Critical alert on bus '+busId()+': '+res.msg+'. Immediate attention required.');
   twCall(callMsg,S.med?'emergency_confirmed':'critical_alert');
  }
 }else if(res.o<3){
  smsSent=false;
  callTriggered=false;
 }
 /* world motion */
 const v=S.speed*.12;
 scr.forEach(o=>{o.position.z+=v*dt;if(o.position.z>40)o.position.z-=L});
 wheels.forEach(w=>w.rotation.x-=v*dt/.6);
 if(S.road==='pothole'){potTimer-=dt;if(potTimer<=0){potTimer=3.2;const p=pots.find(q=>!q.on);if(p){p.on=true;p.f=p.r=false;p.m.position.z=.6-Math.min(40,Math.max(v,2)*2.2);p.m.visible=true}}}
 pots.forEach(p=>{if(!p.on)return;const z=p.m.position.z+=v*dt;if(!p.f&&z>.6){p.f=true;bump=1;spkVal=1.2;spkT=3}if(!p.r&&z>7.2){p.r=true;bump=.7}if(z>14){p.on=false;p.m.visible=false}});
 bump=Math.max(0,bump-rdt*2.5);
 car.position.y=(bump*.16+(S.road==='rough'?.04:0))*Math.sin(t*42);car.rotation.x=bump*.025*Math.sin(t*30);
 /* driver animation */
 let eT=1,mT=.05,pT=0,yT=0;
 if(S.drv==='alert'){eT=(t%3.4)<.14?.1:1;yT=mirYaw}
 else if(S.drv==='yawn'){eT=.35;mT=.55+.45*Math.sin(t*1.6);pT=-.1}
 else if(S.drv==='closed'){eT=.06;pT=-.15-Math.min(.7,ctx.dDur*.12)}
 else if(S.drv==='away'){yT=1.1}
 sm.eye=lerp(sm.eye,eT,rdt,12);sm.mouth=lerp(sm.mouth,mT,rdt,6);sm.pitch=lerp(sm.pitch,pT,rdt,3);sm.yaw=lerp(sm.yaw,yT,rdt,4);
 eyeL.scale.y=eyeR.scale.y=Math.max(.1,sm.eye);mouth.scale.y=.4+sm.mouth*6;mouth.scale.x=1+sm.mouth*.6;neck.rotation.x=sm.pitch;neck.rotation.y=sm.yaw;
 coneD.material.color.setHex(S.camFault?0x777777:(res.mod.driver.l>=2?0xff4040:0x4dff9a));
 /* vehicle animation */
 sm.hot=lerp(sm.hot,S.temp>T.tempLim?1:0,rdt,.8);engMat.emissiveIntensity=sm.hot*.9;
 sm.tyre=lerp(sm.tyre,S.tyre<T.tyreLow?1:0,rdt,1.5);wheels[0].scale.set(1,1-.14*sm.tyre,1-.14*sm.tyre);
 /* passenger animation */
 const col=S.pax==='collapsed',low=S.spo2<T.spo2Lim;
 sm.pz=lerp(sm.pz,col?-.85:0,rdt,2);sm.ph=lerp(sm.ph,col?-.7:(low?-.25:0),rdt,2);sm.pan=lerp(sm.pan,S.panic?1:0,rdt,3);
 pass.rotation.z=sm.pz+.3*sm.pan;headP.rotation.x=sm.ph;headP.rotation.z=col?-.35:0;
 /* alert outputs */
 const o=res.o;
 ledM.forEach((m,i)=>m.emissiveIntensity=i===o?1.5:.1);
 hazM.emissiveIntensity=(o===3&&Math.sin(t*10)>0)?1.6:0;
 seatD.position.x=(o>=2)?Math.sin(t*70)*.02:0;
 beepT-=rdt;if(o>=2&&beepT<=0){beep(o===3?1040:880);beepT=o===3?.35:.8}
 drawDisp();
 /* component colours */
 const bad=new Set();
 if(spkT>0||S.road==='rough')bad.add('imu');
 if(S.temp>T.tempLim)bad.add('temp');
 if(S.batt<11.8)bad.add('batt');
 if(S.tyre<T.tyreLow)bad.add('tp0');
 if(S.camFault)bad.add('camD');
 if(S.gpsFault)bad.add('gps');
 if(S.gsmFault)bad.add('gsm');
 if(S.panic)bad.add('panic');if(S.med){bad.add('med');bad.add('medC')}if(S.door)bad.add('door');
 if(low||col||S.hr<50||S.hr>130)bad.add('spo2');
 if(res.mod.driver.l>0)bad.add('driver');
 if(res.mod.passenger.l>0)bad.add('passenger');
 if(o>=2){bad.add('buzzer');if(o>=2)bad.add('vib')}
 if(phoneT>0)phoneT-=rdt;
 for(const id in C){const c=C[id];if(id==='disp'||id==='lamp')continue;
  let hex=c.color;
  if(bad.has(id))hex=Math.sin(t*9)>0?0xff9800:0xff3030;
  if(id==='phone'&&phoneT>0)hex=0x2fbf8f;
  c.mat.color.setHex(hex);c.mat.emissive.setHex(hex)}
 panicC.o.scale.set(1,1-.45*sm.pan,1);
 /* SMS packet */
 if(pk){pk.t+=rdt/3.2;const u=Math.min(1,pk.t);C.gsm.o.getWorldPosition(tmp);C.tower.o.getWorldPosition(tmp2);
  const A=tmp.clone(),B=tmp2.clone(),Cc=new V3();C.phone.o.getWorldPosition(Cc);
  if(u<.5)pk.m.position.lerpVectors(A,B,u/.5);else pk.m.position.lerpVectors(B,Cc,(u-.5)/.5);
  pk.m.position.y+=Math.sin(u*PI)*3;
  C.tower.o.scale.setScalar(1+.5*Math.abs(Math.sin(t*10)));
  if(u>=1){scene.remove(pk.m);pk=null;phoneT=3;$('sms').textContent=pendingText;C.tower.o.scale.setScalar(1)}}
 /* wires */
 const emph=mode==='stage'&&(stageI===7||stageI===8||stageI===9);
 wires.forEach(w=>{w.a.o.getWorldPosition(tmp);w.b.o.getWorldPosition(tmp2);
  const pa=w.ln.geometry.attributes.position;pa.setXYZ(0,tmp.x,tmp.y,tmp.z);pa.setXYZ(1,tmp2.x,tmp2.y,tmp2.z);pa.needsUpdate=true;
  w.ln.material.opacity=emph?.85:.22;w.t=(w.t+rdt*.5)%1;w.p.position.lerpVectors(tmp,tmp2,w.t);w.p.visible=lblMode!=='none'})
 cones.forEach(c=>c.visible=lblMode!=='none');
 /* camera */
 if(auto&&!touched)tth+=rdt*.12;th+=(tth-th)*.08;ph+=(tph-ph)*.08;cur.lerp(goal,.08);dist+=(gd-dist)*.08;
 cam.position.set(cur.x+dist*Math.sin(ph)*Math.sin(th),cur.y+dist*Math.cos(ph),cur.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(cur);
 /* labels */
 const act=mode==='stage'?STG[stageI].act:[];
 for(const id in C){const c=C[id];if(!c.l)continue;
  const isAct=act.includes(id),isBad=bad.has(id);
  c.o.getWorldPosition(tmp);tmp.y+=.35;tmp.project(cam);
  const show=lblMode==='all'||(lblMode==='active'&&(isAct||isBad));
  c.l.style.display=(show&&tmp.z<1)?'block':'none';
  c.l.style.left=(tmp.x*.5+.5)*innerWidth+'px';c.l.style.top=(-tmp.y*.5+.5)*innerHeight+'px';
  c.l.classList.toggle('act',isAct);c.l.classList.toggle('bad',isBad&&!isAct)}
 updPanels(now);extraPanels(now);if(!ambEl.hidden)ambDraw();
 ren.render(scene,cam);
}
const rdt=$('rd_toggle');if(rdt)rdt.onclick=()=>{const w=$('rd_wrap'),a=$('rd_arr');if(!w)return;const h=w.style.display==='none';w.style.display=h?'block':'none';if(a)a.textContent=h?'▼ Hide':'▲ Show'};
updLb();updPlay();goStage(0);log('Simulator ready, all systems normal');
